<!DOCTYPE html>
<html>
<head>
  <title>Free Fire Tournament</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay"></div>

<div class="container">
  <h1 class="logo">FREE FIRE</h1>
  <h2 class="title">DUO TOURNAMENT</h2>
  <p class="subtitle">🔥 Every Sunday • Entry ₹20 🔥</p>

  <div class="card">
    <input type="text" placeholder="Player Name" id="name">
    <input type="text" placeholder="Free Fire ID" id="ffid">

    <button onclick="showQR()">JOIN NOW ⚡</button>

    <div id="payment" class="hidden">
      <p class="paytext">Scan & Pay</p>
      <img src="qr.jpg">
      <button onclick="confirmJoin()">I PAID ✅</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
